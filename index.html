<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upcoming Task</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="box">

        <div class="inbox">

            <h1 class="Heading">
                Upcoming Task
            </h1>

            <div class="box-for-in">

                <input
                    class="inner-text"
                    type="text"
                    placeholder="Enter your next task"
                >

                <button class="answer">
                    Add
                </button>

            </div>

        </div>


        <div class="note"></div>

    </div>


    <script src="js.js"></script>

</body>
</html>
